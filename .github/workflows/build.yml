name: Build Schola – All Platforms

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

# Allow the release job to create/update GitHub Releases.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # 1. Web / PWA (runs on every push)
  # ─────────────────────────────────────────────
  build-web:
    name: Build Web (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build:web

      - name: Package PWA bundles (Web / ChromeOS / iOS)
        run: |
          # Schola is a PWA (Capacitor wraps the same web build), so ChromeOS
          # and iOS ship as installable PWA bundles alongside the plain Web zip.
          ( cd dist && zip -r ../schola-web.zip . )
          # ChromeOS: install as a PWA, or sideload the Android APK on ChromeOS.
          printf 'Schola for ChromeOS\n\nOpen the live app in Chrome and use\n"Install Schola" from the address bar, or sideload the Android APK.\n' > INSTALL-chromeos.txt
          cp schola-web.zip schola-chromeos.zip && zip -j schola-chromeos.zip INSTALL-chromeos.txt
          # iOS: install as a PWA via Safari → Share → Add to Home Screen.
          printf 'Schola for iOS / iPadOS\n\nOpen the live app in Safari, then\nShare -> Add to Home Screen to install.\n' > INSTALL-ios.txt
          cp schola-web.zip schola-ios.zip && zip -j schola-ios.zip INSTALL-ios.txt

      - name: Upload PWA bundles (Web / ChromeOS / iOS)
        uses: actions/upload-artifact@v4
        with:
          name: schola-pwa-bundles
          path: |
            schola-web.zip
            schola-chromeos.zip
            schola-ios.zip
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist

  # ─────────────────────────────────────────────
  # 2. Electron desktop installers (matrix)
  #    Windows -> NSIS + portable .exe
  #    macOS   -> .dmg + .zip (universal)
  #    Linux   -> .AppImage + .deb (+ .rpm)
  # ─────────────────────────────────────────────
  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            script: electron:build:win
            glob: |
              release/*.exe
              release/*.msi
          - os: macos-latest
            name: macOS
            script: electron:build:mac
            glob: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-latest
            name: Linux
            script: electron:build:linux
            glob: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Build desktop installers
        run: npm run ${{ matrix.script }}
        env:
          # Used by electron-builder for publishing; harmless when not publishing.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Optional macOS signing/notarisation (set these repo secrets to enable):
          # CSC_LINK: ${{ secrets.MAC_CERTS }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schola-desktop-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────
  # 3. Android (Capacitor) – debug APK
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android (Capacitor)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Add Capacitor Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release-mobile
          cp android/app/build/outputs/apk/debug/app-debug.apk release-mobile/Schola-android-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: schola-android
          path: release-mobile/Schola-android-debug.apk
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────
  # 4. iOS (Capacitor) – simulator build verification only.
  #    A distributable .ipa requires Apple signing certs, so this
  #    leg only verifies the project compiles and never blocks release.
  # ─────────────────────────────────────────────
  build-ios:
    name: Build iOS (Capacitor)
    needs: build-web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Add Capacitor iOS platform (if not already present)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build iOS (simulator – no signing required)
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Using simulator: $SIM_ID"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

  # ─────────────────────────────────────────────
  # 5. Create GitHub Release (on v* tags or manual dispatch)
  #    Depends only on the jobs that produce distributable binaries.
  #    iOS is intentionally excluded (no signed .ipa without certs).
  # ─────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # always() lets the release proceed even if one platform leg fails, so a
    # flaky Android/Windows build never blocks shipping the others. The ref/
    # event guard still restricts releases to v* tags and manual dispatch.
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [build-web, build-desktop, build-android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # electron-builder writes to release/, Android APK + web zip are
          # downloaded under artifacts/<artifact-name>/. Match everything.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
