name: Build Schola – All Platforms

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v1.0.0). Leave empty for a validation run."
        required: false

env:
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────
  # 1. Web / PWA (runs on every push)
  # ─────────────────────────────────────────────
  build-web:
    name: Build Web (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Stamp package version from the release tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.version, 'v')
        shell: bash
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          npm version --no-git-tag-version "${v#v}"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build:web

      - name: Package PWA install bundles (Web / ChromeOS / iOS)
        run: |
          mkdir -p bundles
          ( cd dist && zip -qr ../bundles/schola-web.zip . )
          printf 'Schola for ChromeOS\n\nOpen the live app in Chrome and choose "Install Schola" from the\naddress bar, or sideload the Android APK from this release.\n' > INSTALL-chromeos.txt
          cp bundles/schola-web.zip bundles/schola-chromeos.zip
          zip -qj bundles/schola-chromeos.zip INSTALL-chromeos.txt
          printf 'Schola for iOS / iPadOS\n\nOpen the live app in Safari, then Share -> Add to Home Screen\nto install.\n' > INSTALL-ios.txt
          cp bundles/schola-web.zip bundles/schola-ios-pwa.zip
          zip -qj bundles/schola-ios-pwa.zip INSTALL-ios.txt

      - name: Upload PWA install bundles
        uses: actions/upload-artifact@v4
        with:
          name: schola-pwa-bundles
          path: bundles/*.zip
          retention-days: 30

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: schola-web
          path: dist/
          retention-days: 30

  # ─────────────────────────────────────────────
  # 2. Electron – Windows
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows (Electron)
    runs-on: windows-latest
    needs: build-web
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Stamp package version from the release tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.version, 'v')
        shell: bash
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          npm version --no-git-tag-version "${v#v}"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Build Windows installer
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure login (OIDC, no stored secret)
        if: vars.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows binaries with Azure Trusted Signing
        if: vars.AZURE_TENANT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ vars.TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TS_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.TS_CERT_PROFILE }}
          files-folder: release
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schola-windows
          path: |
            release/*.exe
            release/*.msi
          retention-days: 30

  # ─────────────────────────────────────────────
  # 3. Electron – macOS
  # ─────────────────────────────────────────────
  build-macos:
    name: Build macOS (Electron)
    runs-on: macos-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Stamp package version from the release tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.version, 'v')
        shell: bash
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          npm version --no-git-tag-version "${v#v}"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Build macOS app
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment for signed releases:
          # CSC_LINK: ${{ secrets.MAC_CERTS }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schola-macos
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30

  # ─────────────────────────────────────────────
  # 4. Electron – Linux
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux (Electron)
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Stamp package version from the release tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.version, 'v')
        shell: bash
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          npm version --no-git-tag-version "${v#v}"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Build Linux packages
        run: npm run electron:build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schola-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          retention-days: 30

  # ─────────────────────────────────────────────
  # 5. Android (Capacitor)
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android (Capacitor)
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy "tools"
          # package, which Google removed from the SDK repository; sdkmanager
          # now exits 1 on it. Request only what Capacitor 6 needs.
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Stamp package version from the release tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.version, 'v')
        shell: bash
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          npm version --no-git-tag-version "${v#v}"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Add Capacitor Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the APK by version
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Schola-$v-android-debug.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: schola-android
          path: out/*.apk
          retention-days: 30

  # ─────────────────────────────────────────────
  # 6. iOS (Capacitor) – requires macOS runner
  # ─────────────────────────────────────────────
  build-ios:
    name: Build iOS (Capacitor)
    runs-on: macos-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Stamp package version from the release tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.version, 'v')
        shell: bash
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          npm version --no-git-tag-version "${v#v}"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Add Capacitor iOS platform (if not already present)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build iOS (simulator – no signing required)
        run: |
          # Pick the first available iPhone simulator dynamically
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Using simulator: $SIM_ID"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package simulator app bundle
        run: |
          v=$(node -p "require('./package.json').version")
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*/Build/Products/Debug-iphonesimulator/App.app" | head -n 1)
          test -n "$app" || { echo "App.app not found" >&2; exit 1; }
          mkdir -p out
          ditto -c -k --keepParent "$app" "out/Schola-$v-ios-simulator.zip"
          ls -l out

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: schola-ios
          path: out/*.zip
          retention-days: 30

  # ─────────────────────────────────────────────
  # 7. Create GitHub Release (on version tags)
  # ─────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    needs: [build-web, build-windows, build-macos, build-linux, build-android, build-ios]
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          # Only packaged installers/bundles — NOT artifacts/**/*: the
          # schola-web artifact is the raw dist/ tree (hundreds of loose
          # files, duplicate names) and globbing it broke asset metadata
          # updates, leaving v1.3.4 stuck as an unpublished draft.
          files: |
            artifacts/schola-pwa-bundles/*.zip
            artifacts/schola-windows/*
            artifacts/schola-macos/*
            artifacts/schola-linux/*
            artifacts/schola-android/*
            artifacts/schola-ios/*
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Redeploy GitHub Pages with the new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
