name: Build Schola – All Platforms

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────
  # 1. Web / PWA (runs on every push)
  # ─────────────────────────────────────────────
  build-web:
    name: Build Web (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build:web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: schola-web
          path: dist/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist

  # ─────────────────────────────────────────────
  # 2. Electron – Windows
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows (Electron)
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Build Windows installer
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schola-windows
          path: |
            release/*.exe
            release/*.msi
          retention-days: 30

  # ─────────────────────────────────────────────
  # 3. Electron – macOS
  # ─────────────────────────────────────────────
  build-macos:
    name: Build macOS (Electron)
    runs-on: macos-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Build macOS app
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment for signed releases:
          # CSC_LINK: ${{ secrets.MAC_CERTS }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schola-macos
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30

  # ─────────────────────────────────────────────
  # 4. Electron – Linux
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux (Electron)
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Build Linux packages
        run: npm run electron:build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schola-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          retention-days: 30

  # ─────────────────────────────────────────────
  # 5. Android (Capacitor)
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android (Capacitor)
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Add Capacitor Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: schola-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─────────────────────────────────────────────
  # 6. iOS (Capacitor) – requires macOS runner
  # ─────────────────────────────────────────────
  build-ios:
    name: Build iOS (Capacitor)
    runs-on: macos-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Add Capacitor iOS platform (if not already present)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build iOS (simulator – no signing required)
        run: |
          # Pick the first available iPhone simulator dynamically
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Using simulator: $SIM_ID"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schola-ios-build
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
          if-no-files-found: ignore
          retention-days: 30

  # ─────────────────────────────────────────────
  # 7. Create GitHub Release (on version tags)
  # ─────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # always() so one failed platform build (historically iOS) doesn't kill
    # the whole release — we publish whatever was built successfully.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build-web, build-windows, build-macos, build-linux, build-android, build-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage release assets
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p release

          # Desktop installers keep the names electron-builder gave them.
          for d in artifacts/schola-windows artifacts/schola-macos artifacts/schola-linux; do
            [ -d "$d" ] || continue
            find "$d" -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
              -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
              -exec cp {} release/ \;
          done

          # Android debug APK gets a versioned name.
          if [ -d artifacts/schola-android ]; then
            APK="$(find artifacts/schola-android -type f -name '*.apk' | head -n 1 || true)"
            if [ -n "$APK" ]; then
              cp "$APK" "release/Schola-android-${VER}.apk"
            fi
          fi

          # Web / ChromeOS / iOS bundles are all packaged from the web dist.
          if [ -d artifacts/schola-web ]; then
            # Web: the PWA dist as a single zip (not loose files).
            (cd artifacts/schola-web && zip -qr "$GITHUB_WORKSPACE/release/Schola-web-${VER}.zip" .)

            # ChromeOS: PWA dist + install instructions.
            rm -rf stage-chromeos
            cp -r artifacts/schola-web stage-chromeos
            printf '%s\n' \
              '# Schola on ChromeOS' \
              '' \
              'ChromeOS runs Schola as an installable PWA — no APK needed.' \
              '' \
              '## Install (recommended)' \
              '1. Open https://socrtwo.github.io/Schola/ in Chrome on your Chromebook.' \
              '2. Click the install icon in the address bar (or Menu -> Install Schola).' \
              '3. Schola appears in the launcher and works offline after first load.' \
              '' \
              '## Run from this bundle' \
              '1. Unzip into Files -> My files.' \
              '2. Open index.html in Chrome.' \
              '' \
              'Chromebooks with Play Store support can alternatively sideload the' \
              'Android APK from this same release.' \
              > stage-chromeos/INSTALL.md
            (cd stage-chromeos && zip -qr "$GITHUB_WORKSPACE/release/Schola-chromeos-${VER}.zip" .)

            # iOS: PWA dist + install instructions (no signed IPA is produced).
            rm -rf stage-ios
            cp -r artifacts/schola-web stage-ios
            printf '%s\n' \
              '# Schola on iOS / iPadOS' \
              '' \
              'Schola installs on iPhone and iPad as a PWA — no App Store needed.' \
              '' \
              '## Install (recommended)' \
              '1. Open https://socrtwo.github.io/Schola/ in Safari on your device.' \
              '2. Tap the Share button.' \
              '3. Tap "Add to Home Screen".' \
              '4. Schola appears on your home screen as a standalone app.' \
              '' \
              '## Native build (developers)' \
              'A native iOS app can be produced from this repo with Capacitor:' \
              'run "npm run build:web", then "npx cap add ios" and' \
              '"npx cap sync ios", and open ios/App/App.xcworkspace in Xcode.' \
              'Signing and distribution require an Apple Developer account.' \
              > stage-ios/INSTALL.md
            (cd stage-ios && zip -qr "$GITHUB_WORKSPACE/release/Schola-ios-${VER}.zip" .)
          fi

          echo "Release assets:"
          ls -la release/

          # Never publish an empty release.
          if [ -z "$(ls -A release/)" ]; then
            echo "::error::No release assets were produced — refusing to publish an empty release."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
