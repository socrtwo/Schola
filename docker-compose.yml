version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schola
      POSTGRES_USER: schola
      POSTGRES_PASSWORD: schola_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schola"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo --no-input 2>/dev/null;
             gunicorn schola.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload"
    volumes:
      - .:/app
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=schola
      - DB_USER=schola
      - DB_PASSWORD=schola_dev
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DJANGO_DEBUG=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  static_files:
