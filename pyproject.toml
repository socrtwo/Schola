[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schola"
version = "1.0.0"
description = "Multi-tenant continuing education registration and administration system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Schola Contributors"},
]
keywords = ["education", "registration", "django", "continuing-education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "Django>=5.2,<6.0",
    "psycopg2-binary>=2.9",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "weasyprint>=62.0",
    "Pillow>=10.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "flake8",
    "black",
    "isort",
]
desktop = [
    "PyInstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/schola-project/schola"
Documentation = "https://github.com/schola-project/schola/tree/main/docs"
Repository = "https://github.com/schola-project/schola"
Issues = "https://github.com/schola-project/schola/issues"

[project.scripts]
schola = "schola.cli:main"

[tool.setuptools.packages.find]
include = ["schola*", "core*"]

[tool.setuptools.package-data]
core = [
    "templates/**/*.html",
    "static/**/*",
    "management/**/*.py",
]
