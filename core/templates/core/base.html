{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0066cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schola">
<link rel="manifest" href="{% static 'core/manifest.json' %}">
<link rel="apple-touch-icon" href="{% static 'core/icon-192.png' %}">
<title>{% block title %}{{ org.name }}{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         line-height: 1.6; color: #333; max-width: 960px; margin: 0 auto; padding: 20px; }
  header { border-bottom: 2px solid #333; padding-bottom: 12px; margin-bottom: 24px; }
  header h1 { font-size: 24px; }
  header nav { margin-top: 8px; }
  header nav a { margin-right: 16px; color: #0066cc; text-decoration: none; }
  header nav a:hover { text-decoration: underline; }
  main { min-height: 400px; }
  h2 { font-size: 20px; margin: 24px 0 12px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  h3 { font-size: 16px; margin: 16px 0 8px; }
  a { color: #0066cc; }
  .event-card { border: 1px solid #ddd; border-radius: 4px; padding: 16px; margin-bottom: 16px; }
  .event-card h3 { margin-top: 0; }
  .meta { color: #666; font-size: 14px; }
  .fee { font-weight: bold; color: #333; }
  footer { margin-top: 48px; padding-top: 12px; border-top: 1px solid #ddd;
           font-size: 13px; color: #888; text-align: center; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<header>
  <h1>{{ org.name }}</h1>
  <nav>
    <a href="{% url 'core:org_home' org.slug %}">Home</a>
    <a href="{% url 'core:catalog_list' org.slug %}">Catalog</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  &copy; {{ org.name }}. Powered by Schola.
</footer>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("{% static 'core/sw.js' %}")
    .catch(function() {});
}
</script>
</body>
</html>
